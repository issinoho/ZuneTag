name: Build Windows executable

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Computes the next release version (existing tags are vX.Y.Z; this bumps
      # the patch number) so the assembly version baked into this build already
      # matches the tag/release that gets created from its artifact afterwards,
      # rather than the two drifting apart.
      - name: Determine next version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $tags = git tag --list 'v*.*.*' |
            ForEach-Object { $_.Substring(1) } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_ } |
            Sort-Object
          if ($tags.Count -eq 0) {
            $next = [version]"1.1.0"
          } else {
            $latest = $tags[-1]
            $next = [version]::new($latest.Major, $latest.Minor, $latest.Build + 1)
          }
          $versionString = "$($next.Major).$($next.Minor).$($next.Build).0"
          Write-Host "Computed next version: $versionString"
          echo "version=$versionString" >> $env:GITHUB_OUTPUT

      - name: Set assembly version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          (Get-Content Properties/AssemblyInfo.cs) `
            -replace '^\[assembly: AssemblyVersion\("[^"]*"\)\]', "[assembly: AssemblyVersion(`"$version`")]" `
            -replace '^\[assembly: AssemblyFileVersion\("[^"]*"\)\]', "[assembly: AssemblyFileVersion(`"$version`")]" |
            Set-Content -Encoding utf8BOM Properties/AssemblyInfo.cs
          Write-Host "Set assembly version to $version"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up NuGet
        uses: nuget/setup-nuget@v4
        with:
          nuget-version: "6.x"

      # ZuneTag.csproj and WMFSDKWrapper.csproj use the classic packages.config
      # restore model, so this is a plain NuGet restore rather than a
      # PackageReference/MSBuild restore.
      - name: Restore NuGet packages
        run: nuget restore ZuneTag.sln

      # Only ZuneTag.csproj (and its WMFSDKWrapper project reference) are built
      # here - the app's own tag-editing code P/Invokes into the Windows Media
      # Format SDK's WMVCore.dll only at runtime, so nothing extra is needed to
      # build it. Costura.Fody (wired up via packages.config + FodyWeavers.xml)
      # embeds all managed dependencies (TMDbLib, Newtonsoft.Json,
      # WMFSDKWrapper.dll, etc.) into ZuneTag.exe as part of this build.
      - name: Build ZuneTag.exe (Release, x86)
        run: msbuild ZuneTag.csproj /p:Configuration=Release /p:Platform=x86 /p:DeployOnBuild=false /m

      - name: Upload ZuneTag.exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZuneTag
          path: bin\x86\Release\ZuneTag.exe
          if-no-files-found: error
